<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GIN RUMMY prototype</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><b>GIN RUMMY</b><small>prototype v0.1</small></div><button id="newGame">NEW GAME</button></header><section class="opponent"><div class="label">CPU <span id="cpuCount"></span></div><div id="cpuHand" class="hand cpu"></div></section><section class="table"><div class="status" id="status">ゲームを開始します</div><div class="piles"><button class="pile stock" id="stock"><span class="back">♠</span><small>山札 <b id="stockCount"></b></small></button><button class="pile discard" id="discard"><span id="discardCard"></span><small>捨て札</small></button></div></section><section class="player"><div class="label">YOU <span id="phaseHint"></span></div><div id="playerHand" class="hand"></div></section><footer>1枚引いて、手札から1枚捨てる</footer></main><script src="game.js"></script></body></html>
